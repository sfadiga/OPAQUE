[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-framework"
version = "1.0.2"
description = "OPAQUE - Opinionated Python Application with Qt UI for Engineering. A flexible MDI application framework for PySide6."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sandro Fadiga", email = "sfadiga@gmail.com"}
]
keywords = ["gui", "qt", "pyside6", "mdi", "framework", "desktop", "application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "PySide6>=6.0.0",
]

[project.optional-dependencies]
# Extra theme sources. The framework offers Default, Light and Dark with no
# extra package. Install this extra to add the qt-themes, qt-material and
# QDarkStyleSheet themes. See src/opaque/services/theme_providers.py.
themes = [
    # 0.4.0 is the latest qt-themes on PyPI. The floor used to say 1.0.0,
    # which has never been published, so this extra could not install at all.
    "qt-themes>=0.4.0",
    "qt-material>=2.14",
    "QDarkStyle>=3.2.0",
]
build = [
    "pyinstaller>=5.0",
    "nuitka>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "black>=22.0",
    "pylint>=2.0",
    "mypy>=1.0",
    "build",
    "wheel",
]

[project.scripts]
opaque-build = "opaque.build_tools.cli:main"

[project.urls]
"Homepage" = "https://github.com/sfadiga/OPAQUE"
"Bug Tracker" = "https://github.com/sfadiga/OPAQUE/issues"
"Documentation" = "https://github.com/sfadiga/OPAQUE#readme"
"Source Code" = "https://github.com/sfadiga/OPAQUE"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
opaque = ["py.typed", "translations/*.qm", "translations/*.ts"]

[tool.pylint.MASTER]
extension-pkg-whitelist = ["PySide6"]

[tool.pylint.TYPECHECK]
ignored-modules = ["PySide6", "PySide6.QtCore", "PySide6.QtGui", "PySide6.QtWidgets"]

[tool.pylint."MESSAGES CONTROL"]
# Deferred, not silenced: see docs/known-issues/pylint-design-metrics.md for
# what each of these covers, which classes trip them, and why fixing them for
# real is a separate, larger piece of work than this pass.
disable = [
    "too-many-instance-attributes",
    "too-few-public-methods",
    "too-many-public-methods",
    "too-many-branches",
    "too-many-locals",
    "too-many-statements",
    "too-many-arguments",
    "too-many-positional-arguments",
    "duplicate-code",
    "attribute-defined-outside-init",
]

[tool.pylint.BASIC]
# Qt calls a widget override by its exact C++ name (keyPressEvent,
# closeEvent, eventFilter, ...); PySide6's binding layer never sees a
# snake_case method, so renaming these would silently stop Qt from calling
# them. The pattern accepts pylint's own snake_case rule for every other
# method, plus this framework's known Qt overrides by name.
method-rgx = "^(?:[^\\WA-Z][^\\WA-Z]*|_[^\\WA-Z]*|__[^\\WA-Z\\d_][^\\WA-Z]+__|closeEvent|dragEnterEvent|dropEvent|enterEvent|eventFilter|focusInEvent|focusOutEvent|keyPressEvent|leaveEvent|setWidget|showEvent)$"

# Pylint's default typevar pattern rejects any name ending in "Type"
# (a deliberate rule to stop TypeVar from being confused with a type
# alias), but ServiceType is the name ServiceLocator.get() and
# FeatureContext.service() both already used before this check ran.
typevar-rgx = "^_{0,2}[A-Z][A-Za-z0-9]*$"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
files = ["src/opaque"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-framework"
version = "1.0.2"
description = "OPAQUE - Opinionated Python Application with Qt UI for Engineering. A flexible MDI application framework for PySide6."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sandro Fadiga", email = "sfadiga@gmail.com"}
]
keywords = ["gui", "qt", "pyside6", "mdi", "framework", "desktop", "application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "PySide6>=6.0.0",
    "qt-material>=2.14",
    "QDarkStyle>=3.2.0",
]

[project.optional-dependencies]
themes = [
    # 0.4.0 is the latest qt-themes on PyPI. The floor used to say 1.0.0,
    # which has never been published, so this extra could not install at all.
    "qt-themes>=0.4.0",
]
build = [
    "pyinstaller>=5.0",
    "nuitka>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "black>=22.0",
    "pylint>=2.0",
    "mypy>=1.0",
    "build",
    "wheel",
]

[project.scripts]
opaque-build = "opaque.build_tools.cli:main"

[project.urls]
"Homepage" = "https://github.com/sfadiga/OPAQUE"
"Bug Tracker" = "https://github.com/sfadiga/OPAQUE/issues"
"Documentation" = "https://github.com/sfadiga/OPAQUE#readme"
"Source Code" = "https://github.com/sfadiga/OPAQUE"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
opaque = ["py.typed", "translations/*.qm", "translations/*.ts"]

[tool.pylint.MASTER]
extension-pkg-whitelist = ["PySide6"]

[tool.pylint.TYPECHECK]
ignored-modules = ["PySide6", "PySide6.QtCore", "PySide6.QtGui", "PySide6.QtWidgets"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
files = ["src/opaque"]
ignore_missing_imports = true

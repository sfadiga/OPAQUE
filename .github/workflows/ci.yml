# OPAQUE Framework continuous integration.
#
# No CI is the root cause of the two release blockers the 2026-09-08 review
# found: a module with a syntax error and a package of example services that
# import a package that does not exist. Nothing ever imported them.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    env:
      # Qt needs a platform plugin. Every test in this suite is headless.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the environment
        # Not --all-extras. The `build` extra pulls PyInstaller and Nuitka,
        # which are tens of megabytes on each of the four matrix legs, and no
        # test in this suite runs a real build. `themes` is included because
        # the theme service imports its packages.
        run: >
          uv sync --extra dev --extra themes
          --python ${{ matrix.python-version }}

      - name: Install the Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Import every module
        run: uv run python -m pytest tests/test_imports.py -q

      - name: Run the suite
        run: uv run python -m pytest tests -q

      # These two steps report but do not gate yet. Plan 10 Task 8 removes
      # continue-on-error once the existing error count reaches zero.
      - name: Type check
        continue-on-error: true
        run: uv run python -m mypy src/opaque

      - name: Lint
        continue-on-error: true
        run: uv run python -m pylint src/opaque

  wheel:
    # Build the wheel and import it with NO extras installed.
    #
    # Nothing else here proves the published artefact is usable. Every leg of
    # the `check` job runs `uv sync`, which installs the source tree in
    # editable mode and always includes the `themes` extra, and the test suite
    # reads `src` directly because of `pythonpath = ["src"]`.
    #
    # This job fails today, and that is deliberate.
    # `src/opaque/services/theme_service.py` imports `qt_themes` at module
    # scope, and `qt-themes` is in the optional `themes` extra, so
    # `pip install opaque-framework` produces a package that cannot be
    # imported. That is review item 2.1. Plan 03 makes every theme provider
    # import lazy, and Plan 03 removes the continue-on-error below.
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Build the wheel
        run: uv build --wheel

      - name: Import the wheel with no extras
        env:
          QT_QPA_PLATFORM: offscreen
        # The working directory changes on purpose. Python puts the current
        # directory on sys.path for `-c`, and importing the source tree
        # instead of the installed wheel would defeat the whole job.
        run: |
          uv venv /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck/bin/python dist/*.whl
          cd /tmp
          /tmp/wheelcheck/bin/python -c "import opaque; print(opaque.__version__, len(opaque.__all__))"
